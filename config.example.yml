# Server binding
host: 127.0.0.1
port: 1337

# Data directory (relative or absolute path)
# If not set, defaults to the current working directory
# db and logs are created under this path.
# A relative path is resolved against the directory containing this config file.
data_dir: .

# Global action timeout in seconds (per-action timeout overrides this)
timeout: 10

# Environment variables injected into all action commands
env:
  PATH: /usr/local/bin:/usr/bin:/bin
  LANG: en_US.UTF-8

# Log cleanup settings
clean_days: 30   # Delete history records older than N days
max_log_num: 100 # Keep at most N most recent log files

# Tags identifying this server (also settable via RUNIC_TAGS, comma-separated,
# which overrides this). An action runs here if any of its tags matches, or if
# either side is "*". Unset/empty means ["*"]: everything runs.
# Set RUNIC_TAGS=- to run nothing on this server.
tags: ["*"]

# Actions, keyed by action id.
# Only `command` is required. `name`, `timeout`, `cwd`, `cron`,
# `concurrency`, and `tags` are optional.
# `concurrency` defaults to `1`. Set it to `0` to allow unlimited overlapping runs.
# `tags` targets actions at servers: "*" runs everywhere, absent runs nowhere
# except on wildcard servers. Restart the server after changing actions.
actions:
  demo:
    command: |
      echo "Hello, world"
    cron: "* * * * *"
    tags: ["*"]
